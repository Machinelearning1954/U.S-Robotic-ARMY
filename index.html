<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U.S. Robotic ARMY</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a22;
      --border: #223040;
      --text: #e6edf3;
      --muted: #9fb0c0;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      max-width: 640px;
      margin-inline: auto;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .reel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .reel h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 600;
      text-align: center;
    }
    .instagram-media {
      background: #fff;
      border: 0;
      border-radius: 3px;
      box-shadow: 0 0 1px 0 rgba(0,0,0,0.5), 0 1px 10px 0 rgba(0,0,0,0.15);
      margin: 1px auto;
      max-width: 540px;
      min-width: 326px;
      padding: 0;
      width: 100%;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>U.S. Robotic ARMY</h1>
    <p>Featured media from our channel — embedded directly below.</p>
  </header>

  <main>
    <section class="reel" aria-label="Featured Instagram Reel">
      <h2>Featured Reel</h2>

      <!-- Instagram embed: reel DaB2WCzTrtP -->
      <blockquote
        class="instagram-media"
        data-instgrm-captioned
        data-instgrm-permalink="https://www.instagram.com/reel/DaB2WCzTrtP/?utm_source=ig_embed&amp;utm_campaign=loading"
        data-instgrm-version="14">
        <a href="https://www.instagram.com/reel/DaB2WCzTrtP/?utm_source=ig_embed&amp;utm_campaign=loading" target="_blank" rel="noopener noreferrer">
          View this reel on Instagram
        </a>
      </blockquote>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 U.S. Robotic ARMY &middot;
      <a href="https://www.instagram.com/reel/DaB2WCzTrtP/" target="_blank" rel="noopener noreferrer">Open on Instagram</a>
    </p>
  </footer>

  <!-- Instagram embed script: processes the blockquote above into the rich embed -->
  <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
