<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>U.S. Robotic Army — Repo Protocol</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f14; overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  /* Touch controls (shown only on touch devices) */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  .tbtn {
    position: absolute; pointer-events: auto;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.35);
    color: #fff; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn:active { background: rgba(255,255,255,0.28); }
  #tLeft  { left: 18px;  bottom: 84px; }
  #tRight { left: 104px; bottom: 84px; }
  #tGas   { right: 18px; bottom: 150px; }
  #tBrake { right: 18px; bottom: 66px; }
  #tAct   { right: 104px; bottom: 108px; width: 56px; height: 56px; font-size: 18px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="tbtn" id="tLeft">&#9664;</div>
  <div class="tbtn" id="tRight">&#9654;</div>
  <div class="tbtn" id="tGas">&#9650;</div>
  <div class="tbtn" id="tBrake">&#9660;</div>
  <div class="tbtn" id="tAct">E</div>
</div>
<script src="game.js"></script>
</body>
</html>
