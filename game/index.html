<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U.S. Robotic ARMY — Tactical Recon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e0a'/%3E%3Crect x='3' y='6' width='10' height='5' rx='1' fill='%234a6b3f'/%3E%3Crect x='6' y='3' width='4' height='4' rx='1' fill='%239fd08a'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e0a; font-family: "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud { position: fixed; color: #cfe3c8; text-shadow: 0 1px 2px #000; pointer-events: none; user-select: none; }
  #topbar { top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px 14px; font-size: 14px; background: linear-gradient(#000a, #0000); }
  #topbar b { color: #9fd08a; letter-spacing: 1px; }
  #unitpanel { left: 14px; bottom: 14px; font-size: 13px; line-height: 1.5; background: #0a120acc; border: 1px solid #3a5232; border-radius: 6px; padding: 10px 14px; min-width: 220px; }
  #unitpanel .hp { color: #8fd07a; }
  #msg { top: 42%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: 3px; color: #e4f0da; display: none; }
  #msg small { display: block; font-size: 15px; font-weight: 400; letter-spacing: 1px; margin-top: 10px; color: #a9bda0; }
  #help { right: 14px; bottom: 14px; font-size: 12px; text-align: right; color: #90a288; background: #0a120a99; border-radius: 6px; padding: 8px 12px; }
  #loading { top: 45%; left: 0; right: 0; text-align: center; font-size: 18px; color: #9fd08a; }
  #mapsource { color: #7fa8c8; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="topbar">
  <div><b>U.S. ROBOTIC ARMY</b> · Tactical Recon</div>
  <div id="objhud">Objectives: 0 / 0</div>
  <div id="mapsource">map: —</div>
</div>
<div class="hud" id="unitpanel">No unit selected</div>
<div class="hud" id="help">
  Left-click: select unit · Right-click: move order<br>
  Drag: orbit · Wheel: zoom · [1–4]: select unit · [Space]: recon flyover
</div>
<div class="hud" id="msg"></div>
<div class="hud" id="loading">Deploying units…</div>

<!-- Embedded map: generated by lingbot_map_integration (export_game_map.py or make_demo_map.py).
     The .js wrapper lets the game run from file:// with no server. Served over http,
     ?map=<name> fetches game/maps/<name>.json instead. -->
<script src="maps/training_grounds.js"></script>

<!-- three.js r160 vendored locally (game/vendor/) so the game works fully offline -->
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/loaders/GLTFLoader.js": "./vendor/loaders/GLTFLoader.js"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
