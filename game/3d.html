      else if(Math.hypot(P.x-EARP.X,P.z-EARP.Z)<15){
        phase=3;wellFed=true;addClout(50);pot.visible=potPil.visible=false;
        toast('DELIVERED HOT — WELL FED: TOP SPEED +12%');}
      target=EARP;
    }else{
      if(Math.hypot(P.x-FORTP.X,P.z-FORTP.Z)<12){hasPot=true;potT=90;beaconTo(potPil,EARP.X,EARP.Z);toast('POT SECURED — 90s, and keep it DRY');}
      target=FORTP;
    }
    progText=hasPot?'LOW & SLOW  deliver to THE EAR  '+(potT|0)+'s':'LOW & SLOW  pick up the pot at FORT FLAVOR';
  }else{
    progText='FREE ROAM — the island is yours  ·  WELL FED';
  }
  $('prog').textContent=progText;
  const arrow=$('arrow');
  if(target){
    const nd2=Math.hypot(P.x-target.X,P.z-target.Z);
    const rel=Math.atan2(-(target.Z-P.z),target.X-P.x)-P.a;
    arrow.style.display='block';
    arrow.style.transform='translateX(-50%) rotate('+(-rel*180/Math.PI)+'deg)';
    $('dist').textContent=(nd2|0)+' m';}
  else{arrow.style.display='none';$('dist').textContent='';}
  $('tele').textContent=(wet?'HULL MODE  ':'ENGINE OK  ')+Math.abs(P.v*3.6|0)+' km/h'+(wellFed?'  ·  WELL FED':'');
  if(perf>toastT)$('toast').style.opacity=0;
  const w=innerWidth,h=innerHeight;
  if(grade)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
function fit(){renderer.setSize(innerWidth,innerHeight,false);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',fit);fit();
// headless-test / debug handle (no gameplay effect)
window.__paudc={P,beacons,crocs,SANCT,FORTP,EARP,
  st:()=>({phase,relocated,carrying:carryCroc?carryCroc.name:null,hasPot,wellFed,clout,grade,tier:TIER}),setGrade,
  skipTour:()=>{for(const b of beacons){b.got=true;b.pil.material.color.set(0xffb84d);}}};
{const f=document.getElementById('fine');if(f)f.textContent+=' \u00b7 '+['BASE','HIGH','ULTRA'][TIER]+' TIER';}
toast('PORT ANTONIO UNIFIED DEFENSE COMPLEX');
requestAnimationFrame(tick);
</script>
